name: hw-bot

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  database:
    image: postgres:18.4-bookworm
    restart: unless-stopped
    mem_limit: 448m
    cpus: 1.0
    command:
      - postgres
      - -c
      - max_connections=20
      - -c
      - shared_buffers=96MB
      - -c
      - effective_cache_size=384MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_wal_size=512MB
      - -c
      - jit=off
    environment:
      POSTGRES_USER: hw_bot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: hw_bot
    volumes:
      - database_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging
    networks:
      - backend

  app:
    image: ${HW_BOT_IMAGE:?set by bin/compose.sh from current-release.json}
    init: true
    restart: unless-stopped
    mem_limit: 320m
    cpus: 1.0
    stop_grace_period: 30s
    env_file:
      - config/hw-bot.env
    environment:
      APP__DATABASE__URL: postgres://hw_bot:${POSTGRES_PASSWORD:?required}@database:5432/hw_bot
    volumes:
      - type: bind
        source: ./config/production.toml
        target: /app/config/local.toml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./logs
        target: /app/logs
        bind:
          create_host_path: false
    depends_on:
      database:
        condition: service_healthy
    logging: *logging
    networks:
      - backend

networks:
  backend:

volumes:
  database_data:
