name: hw-bot-dev

services:
  database:
    image: postgres:18.4-bookworm
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hw-bot

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - db_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hw-bot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
