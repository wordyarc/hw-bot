name: hw-bot

services:
  database:
    image: postgres:18.4-bookworm
    restart: unless-stopped
    mem_limit: 448m
    cpus: 1.25
    command:
      - postgres
      - -c
      - max_connections=20
      - -c
      - shared_buffers=96MB
      - -c
      - effective_cache_size=384MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - wal_buffers=4MB
      - -c
      - max_wal_size=512MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - jit=off
    environment:
      POSTGRES_USER: hw_bot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: hw_bot
    volumes:
      - database_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  app:
    image: ${HW_BOT_IMAGE:?required}
    restart: unless-stopped
    mem_limit: 320m
    cpus: 1.0
    stop_grace_period: 30s
    env_file:
      - .env.production
    volumes:
      - ./production.toml:/app/config/local.toml:ro
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "2", "http://127.0.0.1:3000/health/ready"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3
    networks:
      - backend

networks:
  backend:

volumes:
  database_data:
