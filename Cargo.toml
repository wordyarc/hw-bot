[package]
name = "hw-bot"
version = "0.1.0"
edition = "2024"

[lib]
name = "hw_bot"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.22.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
config = { version = "0.15.25", features = ["toml"] }
futures = "0.3.32"
governor = "0.10.4"
hmac = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate", "macros"] }
teloxide = { version = "0.17.0", default-features = false, features = ["macros", "rustls", "cache-me"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"
tower-http = { version = "0.7.0", features = ["limit", "timeout", "trace"] }
tracing = "0.1.44"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.24.0", features = ["v4", "v7", "serde"] }

[dev-dependencies]
testcontainers = { version = "0.28.0", features = ["reusable-containers"] }
tower = { version = "0.5.2", features = ["util"] }
wiremock = "0.6.5"
