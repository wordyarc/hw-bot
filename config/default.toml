[app]
name = "hw-bot"

[server]
host = "127.0.0.1"
port = 3000

[database]
url = "postgres://postgres:postgres@localhost:5432/hw-bot"
max_connections = 5
run_migrations = true

[logging]
level = "hw_bot=info,tower_http=info,sqlx=warn"
format = "compact"
file_enabled = true
file_dir = "logs/hw-bot"
file_prefix = "hw-bot"
file_suffix = "log"
rotation = "daily"
also_stdout = true
