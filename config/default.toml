[app]
name = "hw-bot"

[server]
host = "127.0.0.1"
port = 3000

[database]
url = "postgres://postgres:postgres@localhost:5432/hw-bot"
max_connections = 5
run_migrations = true

[logging]
level = "hw_bot=info,tower_http=info,sqlx=warn"
format = "compact"
file_enabled = true
file_dir = "logs/hw-bot"
file_prefix = "hw-bot"
file_suffix = "log"
rotation = "daily"
also_stdout = true

[telegram]
enabled = false
api_base_url = "https://api.telegram.org"
request_timeout_ms = 5000
shutdown_grace_ms = 10000

[notification_worker]
enabled = false
poll_interval_ms = 500
lease_duration_ms = 15000
max_attempts = 10
retry_initial_ms = 1000
retry_max_ms = 300000
shutdown_grace_ms = 10000
