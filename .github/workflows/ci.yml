name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:
    inputs:
      skip-image:
        type: boolean
        default: false
      skip-coverage:
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SQLX_OFFLINE: "true"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  checks-and-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Workflow lint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # v1.7.12
        with:
          args: -color

      - name: Shell lint
        run: shellcheck tools/actions/*.sh dist/bin/*.sh tools/docker/*.sh

      - name: Backup failure handling
        run: bash tools/actions/test-backup.sh

      - name: Deployment failure handling
        run: bash tools/actions/test-deploy.sh

      - name: Release idempotency
        run: bash tools/actions/test-release.sh

      - name: Deployment bundle
        run: sh tools/actions/package.sh HEAD "$RUNNER_TEMP/deploy.tar.gz"

      - name: Format
        run: make fmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build all targets
        run: make all

      - name: Clippy
        run: make lint

      - name: Unit, integration and documentation tests
        id: tests
        run: make test 2>&1 | tee "$RUNNER_TEMP/test.log"

      - name: Test summary
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: sh tools/actions/test-summary.sh "$RUNNER_TEMP/test.log" >> "$GITHUB_STEP_SUMMARY"

      - name: Rust future compatibility report
        if: ${{ !cancelled() && hashFiles('target/.future-incompat-report.json') != '' }}
        run: |
          cargo report future-incompatibilities --color never | tee "$RUNNER_TEMP/future-incompatibilities.txt"
          {
            printf '### Rust future compatibility\n\n```text\n'
            cat "$RUNNER_TEMP/future-incompatibilities.txt"
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save Rust compatibility report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-compatibility-${{ github.run_attempt }}
          path: ${{ runner.temp }}/future-incompatibilities.txt
          if-no-files-found: ignore
          retention-days: 7

  coverage:
    if: ${{ !inputs.skip-coverage }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain with LLVM tools
        run: |
          rustup toolchain install
          rustup component add llvm-tools

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-llvm-cov

      - name: Coverage
        run: make coverage

      - name: Save coverage report
        id: report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ github.run_attempt }}
          path: target/llvm-cov/html
          retention-days: 7

      - name: Coverage summary
        env:
          REPORT_URL: ${{ steps.report.outputs.artifact-url }}
        run: |
          {
            sh tools/actions/coverage-summary.sh target/llvm-cov/summary.json
            printf '\n[HTML report](%s)\n' "$REPORT_URL"
          } >> "$GITHUB_STEP_SUMMARY"

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-audit

      - name: Audit
        env:
          CARGO_TERM_COLOR: never
        run: make audit 2>&1 | tee "$RUNNER_TEMP/audit.log"

      - name: Audit summary
        if: ${{ !cancelled() }}
        run: |
          if [[ -f "$RUNNER_TEMP/audit.log" ]]; then
            {
              printf '### Dependency audit\n\n```text\n'
              cat "$RUNNER_TEMP/audit.log"
              printf '\n```\n'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  image-smoke:
    if: ${{ !inputs.skip-image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: hw-bot:ci
          cache-from: type=gha,scope=production
          cache-to: type=gha,mode=max,scope=production

      - name: Production startup and bootstrap
        run: sh tools/actions/smoke.sh hw-bot:ci "$RUNNER_TEMP/smoke-diagnostics"

      - name: Save smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-smoke-diagnostics-${{ github.run_attempt }}
          path: ${{ runner.temp }}/smoke-diagnostics
          if-no-files-found: ignore
          retention-days: 7
