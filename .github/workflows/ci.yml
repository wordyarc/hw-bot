name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:
    inputs:
      skip-image:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SQLX_OFFLINE: "true"
  CARGO_TERM_COLOR: always

jobs:
  checks-and-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Deployment scripts and bundle
        run: |
          shellcheck tools/actions/*.sh tools/ops/*.sh tools/docker/*.sh
          bash tools/actions/test-backup.sh
          bash tools/actions/test-deploy.sh
          bash tools/actions/test-release.sh
          sh tools/actions/package.sh HEAD "$RUNNER_TEMP/deploy.tar.gz"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Format
        run: cargo fmt --check

      - name: Build all targets
        run: cargo build --locked --all-targets

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Unit, integration and documentation tests
        run: cargo test --locked

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29
        with:
          tool: cargo-audit

      - name: Audit
        run: cargo audit

  image-smoke:
    if: ${{ !inputs.skip-image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Production image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: hw-bot:ci
          cache-from: type=gha,scope=production
          cache-to: type=gha,mode=max,scope=production

      - name: Production startup and bootstrap
        run: sh tools/actions/smoke.sh hw-bot:ci
